[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echochamber-speakerid"
version = "0.1.0"
description = "Low-latency audio ingestion producing overlapping windows for speaker identification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Deployment target is Windows ARM64. Before adding any dependency with a
# compiled extension, confirm a win_arm64 wheel exists -- this already ruled out
# soxr, which is why the pipeline relies on WASAPI's own resampling instead.
dependencies = [
    # numpy's first win_arm64 wheel is 2.3.0; anything looser lets the ARM64
    # target install a numpy that was never tested here.
    "numpy>=2.3",
    "sounddevice>=0.5.5",
    "PySide6>=6.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.5",
]
# The wake-phrase voice gate. Deliberately NOT a runtime dependency: vosk
# publishes no win_arm64 wheel, so on the ARM64 deployment target this extra
# cannot be installed into the main environment at all. There, vosk lives in a
# separate x64 venv and the gate talks to it over a pipe -- see
# echochamber/voicegate/subprocess_recognizer.py and
# scripts/setup_voice_gate.py. Installing this extra is only useful on x86-64,
# where the in-process backend works directly.
voice-gate = [
    "vosk>=0.3.45",
]
# Sending wake-phrase events over a WebSocket. Unlike vosk this carries no
# ARM64 risk at all: websocket-client is pure Python (a py3-none-any wheel),
# so it installs anywhere. Kept optional anyway because opening a network
# connection is not something a capture tool should start doing by default.
notify = [
    "websocket-client>=1.7",
]
# There is no optional-dependency entry for speaker verification: the only
# speakerid module the main application imports directly,
# echochamber/speakerid/qnn_subprocess.py, needs nothing beyond numpy, and
# scripts/enroll_speaker.py needs nothing beyond sounddevice -- both already
# core dependencies above. Everything else the backend needs (torch,
# torchaudio, onnxruntime, onnxruntime-qnn) lives in the two venvs
# scripts/setup_speakerid_qnn.py builds, never in this project's own
# environment, for the same win_arm64 reason vosk lives in .venv-vosk rather
# than here: torch has no ARM64 wheel, and onnxruntime-qnn's HTP backend only
# loads inside a *native* ARM64 process, which the app's own interpreter
# already is.

[project.scripts]
echochamber = "echochamber.app:main"

[tool.setuptools.packages.find]
include = ["echochamber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps the repo importable without an editable install; harmless once installed.
pythonpath = ["."]
addopts = "-ra --strict-markers"
